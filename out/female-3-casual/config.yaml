seed: 9061
dataset:
  dat_dir: ???
  resolution: 1
  data_device: cpu
  frameset_type: instant_avatar
  num_for_train: -350
  cameras_extent: 1.0
model:
  sh_degree: 3
  num_init_samples: 10000
  xyz_as_uvd: true
  with_mesh_scaling: false
pipe:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
optim:
  optim_xyz:
    lr: 0.008
    scheduler_args:
      lr_init: 0.008
      lr_final: 0.0001
      lr_delay_mult: 0.01
      lr_max_steps: 50000
  optim_features:
    lr: 0.0025
  optim_opacity:
    lr: 0.05
  optim_scaling:
    lr: 0.017
  optim_rotation:
    lr: 0.001
  optim_deformation:
    lr: 0.0001
    scheduler_args:
      lr_init: 0.0001
      lr_final: 0.0001
      lr_delay_mult: 0.01
      lr_max_steps: 50000
  optim_grid:
    lr: 0.005
    scheduler_args:
      lr_init: 0.005
      lr_final: 0.005
      lr_delay_mult: 0.01
      lr_max_steps: 50000
  net_lr_step:
  - 5000
  - 15000
  - 25000
  total_iteration: 50000
  first_iter: 1
  save_every_iter: 10000
  testing_iterations: 50000
  densify_from_iter: 10000
  densify_end_iter: 35000
  densification_interval: 500
  densify_until_iter: 300000
  opacity_reset_start_iter: 0
  opacity_reset_interval: 5000
  size_threshold: 20
  densify_grad_threshold: 0.0002
  min_opacity: 0.005
  lambda_rgb_mse: 10.0
  lambda_ssim: 0.0
  lambda_offset: 1
  lambda_lpips: 0.05
  normal: 0
  lambda_perceptual: 0.01
  lambda_scaling: 1.0
  thresh_scaling_max: 0.008
  thresh_scaling_ratio: 10.0
  lambda_sparsity: 0.0
  lambda_dssim: 0.2
  lambda_L1: 1.5
  metric_xyz: false
  threshold_xyz: 1
  lambda_xyz: 0.01
  lambda_scale: 1.0
  threshold_scale: 0.6
  lambda_dynamic_offset: 0.0
  lambda_dynamic_offset_std: 0
  lambda_laplacian: 0.0
  metric_scale: false
  background: true
  white_background: true
  triangle_walk_interval: 1
\: null
yaml_dir: configs
